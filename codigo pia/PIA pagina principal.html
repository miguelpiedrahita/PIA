<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>pagina principal pia</title>
    <link rel="stylesheet" href="pia.css">
</head>
<body>

    <header>
        <h1>PIA</h1>
        <h2>reporte de daños institucionales</h2>
    </header>

    <div class="contenedor">

        <h1>cuidemos nuestros espacios</h1>

        <p>ayudanos a mantener nuestra institucion en buen estado. reporta los daños que encuentres.</p>

        <div class="tarjeta">

            <h2>registrar un daño</h2>

            <label>nombre del lugar</label>
            <input type="text" placeholder="ejemplo: salon 10-1">

            <label>tipo de daño</label>
            <select>
                <option>seleccione el daño</option>
                <option>daño electrico</option>
                <option>daño en muebles</option>
                <option>daño en paredes</option>
                <option>daño en baños</option>
                <option>otro</option>
            </select>

            <label>descripcion del daño</label>
            <textarea placeholder="escriba aqui lo que sucedio"></textarea>

            <h3>fotografia del daño</h3>

            <div class="foto">
                <p>espacio para colocar la fotografia</p>
            </div>

            <label>nivel de urgencia</label>

            <div class="urgencia">
                <p class="verde">baja</p>
                <p class="amarillo">media</p>
                <p class="rojo">alta</p>
            </div>

            <button>enviar reporte</button>

        </div>

    </div>

    <footer>
        <p>pia - cuidemos nuestra institucion</p>
    </footer>

</body>
</html>
